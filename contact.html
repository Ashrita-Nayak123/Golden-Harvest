<!DOCTYPE html>
<html>

<head>

<style>

body {
    font-family: Arial;
    background: #fffaf3;
    margin: 0;
}

.contact {
    width: 70%;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 10px #bbb;
}

h2 {
    text-align: center;
    color: #5a3744;
    font-family:solid;
    font-size:35px;
}

.info {
    font-size: 18px;
    line-height: 2;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    height: 100px;
}

button {
    background: #4A3025;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 5px;
}


/* FOOTER */

.footer {
    background-color: #5a3744;
    color:black;
    text-align: center;
    padding: 14px;
}

.footer h3 {
    margin: 3px;
    font-size: 15px;
}

.footer p {
    margin: 4px;
    font-size: 11px;
}


</style>

</head>

<body>

<div class="contact">

<h2>CONTACT US</h2>

<div class="info">

<p>📍 Address: Golden Harvest, Main Road Ankola</p>

<p>📞 Phone: 9876543210</p>

<p>📧 Email: goldenharvest@gmail.com</p>

</div>
<form action="con.html">
<h3>Send us a message</h3>

<input type="text" placeholder="Enter your name" required>

<input type="email" placeholder="Enter your email">

<textarea placeholder="Enter your message"></textarea>

<br><br>

<button>Submit</button>

</form>

</div>



<!-- ================= FOOTER ================= -->

<div class="footer">

    <h3>GOLDEN HARVEST</h3>

    <p>Fresh • Healthy • Affordable</p>

    <p>© 2026 Golden Harvest</p>

</div>


</body>
</html>
