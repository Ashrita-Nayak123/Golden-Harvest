<!DOCTYPE html>
<html>
<head>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

h2 {
    text-align: center;
    color:#5A1F2B;
    font-size:35px;
}

.products {
    display: grid;
    grid-template-columns:repeat(5,1fr);
    margin-left:55px;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}

.product {
    width: 180px;
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 3px 10px #bbb;
}

.product img {
    width: 150px;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
}

.product h3 {
    color: #5C4033;
}
.price {
     color:#7A263A;
    font-weight: bold;
}
 /* BUTTONS */

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }

        .cart-btn {
            background: #5a3744;
            color: white;
        }

        
        button:hover {
            opacity: 0.85;
        }




/* MOBILE */

@media screen and (max-width: 700px) {

    .products {
        grid-template-columns: 1fr 1fr;
    }

    .navbar a {
        margin: 0 7px;
        font-size: 11px;
    }

    .header h1 {
        font-size: 21px;
    }

}


</style>

</head>

<body>

    </div>


</div>

<script>

/* ADD TO CART */

function addToCart(name,price){



let cart =
    JSON.parse(localStorage.getItem("cart")) || [];




         let existing =
        cart.find(function(item) {
            return item.name === name;
        });


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            name: name,
            price: price,
            quantity: 1

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart));

    


   alert(name + "  added to cart successfully !");

   window.location.href="cart.html";
 }






/* ORDER NOW */

function orderNow(name, price) {

    addToCart(name, price);

    window.location.href =
        "Cart.html";

}



/* CART COUNT */

function updateCartCount() {

    let count = 0;


    cart.forEach(function(item) {

        count += item.quantity;

    });


    document.getElementById("cartCount").innerText =
        count;

}


updateCartCount();

</script>

</html>
